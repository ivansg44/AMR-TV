name: Cross-platform build test

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: adaptagrams_hash
        run: |
          ADAPTAGRAMS_HASH=$(find adaptagrams/cola -type f \( \
            -name '*.c' -o -name '*.cpp' -o -name '*.h' -o \
            -name '*.m4' -o -name 'Makefile*' \) -exec sha256sum {} \; \
            | sort -k2 | sha256sum | cut -d' ' -f1)
          echo "ADAPTAGRAMS_HASH=$ADAPTAGRAMS_HASH" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            adaptagrams/cola/autom4te.cache*
            adaptagrams/cola/config*
            adaptagrams/cola/Makefile*
            adaptagrams/cola/**/Makefile*
            adaptagrams/cola/libtool
            adaptagrams/cola/lib*/.deps
            adaptagrams/cola/lib*/.libs
            adaptagrams/cola/lib*/*.la
            adaptagrams/cola/lib*/*.lo
            adaptagrams/cola/lib*/*.o
            adaptagrams/cola/lib*/*.so
            adaptagrams/cola/lib*/*.dylib
          key: adaptagrams-build-${{ runner.os }}-${{ env.ADAPTAGRAMS_HASH }}
      - uses: prefix-dev/setup-pixi@v0.9.0
      - run: pixi run compile
      - run: |
          # pixi run start with timeout
          set +e
          timeout 10s pixi run start > start.log 2>&1
          status=$?
          set -e
          if [ $status -eq 124 ]; then
            echo "Timeout reached (normal)"
            exit 0
          elif [ $status -ne 0 ]; then
            echo "App crashed with status $status"
            exit $status
          fi
      - name: Archive start.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-${{ runner.os }}.log
          path: start.log
  test-macos:
    strategy:
      matrix:
        os: [
          # Intel
          macos-13,
          # arm64
          macos-latest
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: adaptagrams_hash
        run: |
          ADAPTAGRAMS_HASH=$(find adaptagrams/cola -type f \( \
            -name '*.c' -o -name '*.cpp' -o -name '*.h' -o \
            -name '*.m4' -o -name 'Makefile*' \) -exec shasum -a 256 {} \; \
            | sort -k2 | shasum -a 256 | cut -d' ' -f1)
          echo "ADAPTAGRAMS_HASH=$ADAPTAGRAMS_HASH" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            adaptagrams/cola/autom4te.cache*
            adaptagrams/cola/config*
            adaptagrams/cola/Makefile*
            adaptagrams/cola/**/Makefile*
            adaptagrams/cola/libtool
            adaptagrams/cola/lib*/.deps
            adaptagrams/cola/lib*/.libs
            adaptagrams/cola/lib*/*.la
            adaptagrams/cola/lib*/*.lo
            adaptagrams/cola/lib*/*.o
            adaptagrams/cola/lib*/*.so
            adaptagrams/cola/lib*/*.dylib
          key: adaptagrams-build-${{ matrix.os }}-${{ env.ADAPTAGRAMS_HASH }}
      - uses: prefix-dev/setup-pixi@v0.9.0
      - run: pixi run compile
      - run: |
          # pixi run start with timeout
          set +e
          # macos does not have timeout but coreutils does
          pixi run timeout 10s pixi run start > start.log 2>&1
          status=$?
          set -e
          if [ $status -eq 124 ]; then
            echo "Timeout reached (normal)"
            exit 0
          elif [ $status -ne 0 ]; then
            echo "App crashed with status $status"
            exit $status
          fi
      - name: Archive start.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-${{ matrix.os }}.log
          path: start.log
