[project]
name = "amr-tv"
version = "0.1.0"
dependencies = [
    "dash==1.20.0",
    "dash-bootstrap-components==0.12.2",
    "networkx==2.8.5",
    # https://github.com/plotly/dash/issues/1992
    "Werkzeug==2.0.0",
    "numpy==1.23.4",
    "pandas==1.5.1",
    "gunicorn==23.0.0",
    "swig==4.2.1",
    "setuptools==80.9.*"
]
requires-python = "==3.10"
authors = [{name = "Ivan S Gill", email = "<ivan_gill@sfu.ca>"}]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
compile = "cd adaptagrams/cola && ./autogen.sh && ./buildPythonSWIG.sh"
start = "python app.py"

[tool.pixi.dependencies]
automake = ">=1.17,<2"
libtool = ">=2.5.4,<3"
cxx-compiler = ">=1.10.0,<2"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
"cairomm-1.0" = ">=1.14.4,<2"
